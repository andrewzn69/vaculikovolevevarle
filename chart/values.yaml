# namespace config
namespace: vaculikovolevevarle

# image config
image:
  bot:
    repository: ghcr.io/andrewzn69/vaculikovolevevarle
    tag: latest
    pullPolicy: Always
  lavalink:
    repository: ghcr.io/lavalink-devs/lavalink
    tag: "4.2.2"
    pullPolicy: IfNotPresent

# resource limits
resources:
  bot:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  lavalink:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# lavalink config
lavalink:
  port: 2333
  javaOpts: "-Xmx2G"

  # spotify plugin config
  spotify:
    countryCode: "CZ"
    playlistLoadLimit: 50
    albumLoadLimit: 20

# secrets
secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: /bots/vaculikovolevevarle
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

# sealed secrets (legacy - use infisical instead)
sealedSecrets:
  enabled: false

# service config
service:
  lavalink:
    type: ClusterIP
    port: 2333

# storage for lavalink plugins and logs
persistence:
  lavalink:
    plugins:
      enabled: false
    logs:
      enabled: false
  bot:
    logs:
      enabled: false
